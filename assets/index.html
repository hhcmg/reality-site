<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山海之间 · 个人小站</title>
  <meta name="description" content="记录旅途、阅读与生活中的微小发现。">
  <style>
    :root{color-scheme:light;--ink:#17352e;--muted:#5b726b;--paper:#f5f3eb;--line:#d5ddd3}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1040px;margin:auto;padding:30px 24px 64px}nav{display:flex;justify-content:space-between;padding:8px 0 22px;border-bottom:1px solid var(--line)}nav a{color:var(--ink);text-decoration:none}
    header{padding:76px 0 60px;max-width:720px}.eyebrow{letter-spacing:.22em;font-size:12px;color:var(--muted)}h1{font-size:clamp(36px,7vw,70px);letter-spacing:-.05em;line-height:1.2;margin:20px 0}p{color:var(--muted)}
    .landscape{height:200px;border-radius:8px;background:radial-gradient(ellipse at 28% 145%,#204f47 0 45%,transparent 46%),radial-gradient(ellipse at 83% 130%,#739082 0 53%,transparent 54%),linear-gradient(#dce8de,#edf0df);margin-bottom:44px}
    .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}article{border-top:1px solid var(--line);padding-top:20px}h2{font-size:21px;margin:8px 0}article small{color:var(--muted)}footer{margin-top:64px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}
    @media(max-width:650px){.notes{grid-template-columns:1fr}header{padding:50px 0 34px}.landscape{height:150px}}
  </style>
</head>
<body><main>
  <nav><strong>山海之间</strong><a href="#notes">随手记</a></nav>
  <header><div class="eyebrow">A SMALL PLACE ON THE WEB</div><h1>留一点时间，<br>看看远处的风景。</h1><p>这里收藏旅途中的片段、书页里的句子，以及值得慢慢琢磨的小事。</p></header>
  <div class="landscape" role="img" aria-label="远山与晴空的抽象风景"></div>
  <section class="notes" id="notes" aria-label="生活笔记">
    <article><small>步行 · WALKING</small><h2>沿着河边走一段</h2><p>走熟悉的路，也能看见不一样的树影。带上水，放慢脚步，把今天留给今天。</p></article>
    <article><small>阅读 · READING</small><h2>书页间的停顿</h2><p>不急着读完。碰到有意思的地方，写下自己的问题，下次再回来看看。</p></article>
    <article><small>记录 · NOTES</small><h2>把小事保存下来</h2><p>一顿饭、一阵风、一句突然想到的话。记录让普通的日子也有了轮廓。</p></article>
  </section>
  <footer>山海之间 · 个人小站</footer>
</main></body></html>
